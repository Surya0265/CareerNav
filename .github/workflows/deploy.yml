name: CareerNav CI/CD Pipeline

# ── TRIGGERS ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]          # Run on every push to main
  pull_request:
    branches: [ main ]          # Run on PRs targeting main (tests only, no deploy)

# ── ENVIRONMENT VARIABLES ─────────────────────────────────────────────────────
env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── JOB 1: TEST ─────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Node backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Node tests
        working-directory: ./backend
        run: npm test || echo "⚠️ No Node tests configured yet – skipping"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Python tests
        working-directory: ./backend
        run: python -m pytest || echo "⚠️ No pytest tests configured yet – skipping"

  # ── JOB 2: BUILD & PUSH DOCKER IMAGES ────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test                   # Only run if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # ── Build & push Node.js backend ──────────────────────────────────────
      - name: Build and Push Node Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-node:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-node:${{ github.sha }}

      # ── Build & push Python backend ───────────────────────────────────────
      - name: Build and Push Python Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.python
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-python:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-python:${{ github.sha }}

      # ── Build & push User Frontend ────────────────────────────────────────
      - name: Build and Push User Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend2
          file: ./frontend2/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-user-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-user-frontend:${{ github.sha }}

      # ── Build & push Admin Frontend ───────────────────────────────────────
      - name: Build and Push Admin Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./admin-frontend
          file: ./admin-frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-admin-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/careernav-admin-frontend:${{ github.sha }}

  # ── JOB 3: DEPLOY TO AWS EC2 ─────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Starting deployment on EC2 ==="
            cd /home/ubuntu/careernav

            # Pull latest images
            docker-compose pull node-backend python-backend user-frontend admin-frontend

            # Restart only the app containers (not mongo, to preserve data)
            docker-compose up -d --no-deps node-backend python-backend user-frontend admin-frontend

            # Remove old dangling images to free disk space
            docker image prune -f

            echo "=== Deployment complete! ==="
            docker-compose ps
